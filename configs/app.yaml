# 应用配置（Viper 加载，环境变量 AS_<KEY> 覆盖，如 AS_MYSQL_HOST、AS_HTTP_ADDR）。
# 密码与密钥不得写在这里：只从环境变量或 deploy/.env 读取（见 internal/config 的 secret 列表），
# 本文件出现 mysql.password / redis.password / minio.access_key / minio.secret_key / auth.jwt_secret 会直接报错。
env: dev
http:
  addr: ":8080"
mysql:
  host: 127.0.0.1
  port: 3306
  user: root
  database: agri_steward
  eval_database: agri_eval
  max_open_conns: 20
redis:
  addr: 127.0.0.1:6379
  db: 0
minio:
  endpoint: 127.0.0.1:9000
  use_ssl: false
  bucket_raw: agri-steward-raw
  bucket_eval: agri-steward-eval
auth:   # 用户 → 农场 → 角色绑定在 user_role 表（种子见 configs/seed/fields.yaml 的 user_roles）
  token_ttl: 24h
log:
  level: info
# 记忆注入（画像 / 近期事件 / 本轮上下文）；AS_MEMORY_ENABLED=false 关闭，关闭后链路正常。
memory:
  enabled: true
  episodic_limit: 5
  rune_budget: 600
# 下发与重试（P1-L4）：max_attempts 是同一张作业单的设备下发次数上限（NOT_EXECUTED 回执可再下发到该上限，L4-B 读同一值）；
# receipt_timeout 是回执时限（dispatch_attempt.receipt_due_at）；device_wait_max 是选不到设备时的最长等待（单无 dispatch_deadline_at 时
# 自 order.dispatch 入队起算，超限放弃下发：首次 → EXPIRED、重试 → FAILED，reason DEVICE_UNAVAILABLE）。
# AS_DISPATCH_MAX_ATTEMPTS / AS_DISPATCH_RECEIPT_TIMEOUT / AS_DISPATCH_DEVICE_WAIT_MAX 覆盖。
dispatch:
  max_attempts: 2
  receipt_timeout: 30m
  device_wait_max: 2h
# 审批体系（P1-L5）：驳回导出 GET /rejections 的 [from, to] 最大跨度（超限 400）；AS_APPROVAL_REJECTION_EXPORT_MAX_SPAN 覆盖。
approval:
  rejection_export_max_span: 744h
# 保留期（P1-L7）：raw_object 按 kind 的保留天数（RawStore.Put 写 expire_at，worker retention 任务到期删对象）；
# 缺任何 kind 启动失败。table_days 只登记不删（audit_log / run_event 不由 retention 清理）。天数均为草拟值「待法务确认」。
retention:
  raw_object_days:
    LLM_IO: 180
    TOOL_RAW: 180
    SNAPSHOT: 1095
    CHECKPOINT: 30
    EXPORT: 30
    DEVICE_CMD: 1095
    RECEIPT_RAW: 1095
    COMPACTED_MSGS: 180   # P2-L6 被压缩的会话原文，与 LLM_IO 同期（待法务确认）
  table_days:
    audit_log: 1095
    run_event: 365
    kb_load_item: 180 # P2 L5：知识加载明细（诊断数据），worker kb-load-retention 逐农场 DELETE ... LIMIT 5000 清理
# 审计（P1-L7）：每日锚点 bucket（cmd/migrate up 建桶并开 object lock COMPLIANCE，天数「待法务确认」）与审计导出区间上限。
audit:
  anchor_bucket: agri-steward-audit-anchor
  anchor_lock_days: 365
  export_max_span: 744h
# 观测（P1-L7-B）：server / worker 各自的 /metrics 监听（不经业务鉴权，只监听这里配置的地址）；
# AS_METRICS_SERVER_ADDR / AS_METRICS_WORKER_ADDR / AS_METRICS_PATH 覆盖。
metrics:
  server_addr: 127.0.0.1:9101
  worker_addr: 127.0.0.1:9102
  path: /metrics
# 告警扫描（P1-L7-B）：无引用建议扫描回看窗口（阈值待实测）、审批积压 gauge 刷新周期、告警审计短写超时（≤500ms）；
# AS_ALERTS_NO_CITATION_WINDOW / AS_ALERTS_BACKLOG_REFRESH / AS_ALERTS_AUDIT_WRITE_TIMEOUT 覆盖。
alerts:
  no_citation_window: 2m
  backlog_refresh: 30s
  audit_write_timeout: 500ms
# 评测调度与作废门禁（P2-L7a）：trial 并发度 = floor(qpm × 0.7 / llm_calls_per_trial)，至少 1（桩模型缺省 = 1）；
# 实验结束 infra_error 占比 > void_infra_error_rate 或存在 grader_error 即 VOID。AS_EVAL_QPM 等覆盖。
eval:
  qpm: 5
  llm_calls_per_trial: 3
  void_infra_error_rate: 0.05
# P2 L3 可信度指标：线上 rollup（quality-metric-rollup）、online judge 抽样（online-judge-sample）、日报
# （agri-steward-eval/report/daily/{yyyymmdd}.html）。enabled=false 时 worker 不起任务（行为不变）。
quality:
  enabled: false
  interval: 1h
  sample_per_category: 5
  sample_salt: p2l3
  judge_tier: standard
  judge_qpm: 6
  judges_dir: eval/judges
  baseline_name: baseline_p1.r2
  baseline_experiment_id: 0   # baseline_p1.r2 冻结后填 exp id；0 时日报差值列为「—」
  report_timezone: Asia/Shanghai

# 长对话压缩（P2-L6，§6.7）：enable_compaction 开时上下文组装估算 token 超过 trigger_tokens 即压缩更早的轮次，
# 保留最近 keep_recent_turns 轮原文，摘要 ≤ summary_max_tokens；prev_run_id 续接要求上一 run 在 session_idle 内结束。
# max_block_tokens 是整个会话块（含白名单 facts）的估算 token 硬上限，超出时先丢最早的原文轮次、再丢摘要，facts 不裁；
# summary_timeout 是单次摘要调用超时，超时放弃压缩（COMPACTION_FAILED）。
# trigger_tokens / max_block_tokens / summary_timeout 为草拟值「待线上数据」（P0-P1 无线上 token 分布，评审记录模板见 docs/dev-log.md P2-L6 节）。
# AS_COMPACTION_TRIGGER_TOKENS 等覆盖。
compaction:
  trigger_tokens: 1200
  session_idle: 30m
  keep_recent_turns: 4
  summary_max_tokens: 300
  max_block_tokens: 6000
  summary_timeout: 10s

# 规则下沉影子比对（P2-L4）：rule_shadow_diff 保留天数（§6.5 缺省 180，worker 按农场逐项 DELETE … LIMIT 5000 清理）
# 与清理周期；AS_RULE_OFFLOAD_SHADOW_DIFF_DAYS / AS_RULE_OFFLOAD_PURGE_EVERY 覆盖。
rule_offload:
  shadow_diff_days: 180
  purge_every: 24h

# 归因周报与线上回流（P2-L8，§6.9 技术实现 2 / 3）：enabled 开时 worker 起 attribution-weekly
# （lock:p2job:attribution-weekly；timezone 下 ISO 周一出上周周报，eval 桶 report/weekly/{week}.html，done 标记 {week}.json），
# top_n 为周报 Top 问题数；kb_load_gaps_key 是 eval 桶里 L5 kb_load_gaps.json 的对象键（无对象时周报该节写「无」）。
# backflow.enabled 开时 worker 起 backflow-collect（lock:p2job:backflow-collect）：选样 → 服务账号 ReadRaw（RAW_READ 审计）
# → 脱敏 → piiclean → drafts_dir 写草稿（只提交 README / .gitkeep）；kb_miss_min_hits 为「高频 KB_MISS」阈值（待线上数据）。
# AS_ATTRIBUTION_ENABLED / AS_ATTRIBUTION_TOP_N / AS_ATTRIBUTION_BACKFLOW_ENABLED 等覆盖。
attribution:
  enabled: false
  timezone: Asia/Shanghai
  top_n: 20
  interval: 1h
  kb_load_gaps_key: nightly/kb_load_gaps.json
  backflow:
    enabled: false
    drafts_dir: eval/backflow/drafts
    kb_miss_min_hits: 3
    max_runs: 50
    service_user_id: 9900   # 与 config.DefaultBackflowServiceUser 一致；部署按实际服务账号覆盖
