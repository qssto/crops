# 应用配置（Viper 加载，环境变量 AS_<KEY> 覆盖，如 AS_MYSQL_HOST、AS_HTTP_ADDR）。
# 密码与密钥不得写在这里：只从环境变量或 deploy/.env 读取（见 internal/config 的 secret 列表），
# 本文件出现 mysql.password / redis.password / minio.access_key / minio.secret_key / auth.jwt_secret 会直接报错。
env: dev
http:
  addr: ":8080"
mysql:
  host: 127.0.0.1
  port: 3306
  user: root
  database: agri_steward
  eval_database: agri_eval
  max_open_conns: 20
redis:
  addr: 127.0.0.1:6379
  db: 0
minio:
  endpoint: 127.0.0.1:9000
  use_ssl: false
  bucket_raw: agri-steward-raw
  bucket_eval: agri-steward-eval
auth:   # 用户 → 农场 → 角色绑定在 user_role 表（种子见 configs/seed/fields.yaml 的 user_roles）
  token_ttl: 24h
log:
  level: info
# 记忆注入（画像 / 近期事件 / 本轮上下文）；AS_MEMORY_ENABLED=false 关闭，关闭后链路正常。
memory:
  enabled: true
  episodic_limit: 5
  rune_budget: 600
# 下发与重试（P1-L4）：max_attempts 是同一张作业单的设备下发次数上限（NOT_EXECUTED 回执可再下发到该上限，L4-B 读同一值）；
# receipt_timeout 是回执时限（dispatch_attempt.receipt_due_at）；device_wait_max 是选不到设备时的最长等待（单无 dispatch_deadline_at 时
# 自 order.dispatch 入队起算，超限放弃下发：首次 → EXPIRED、重试 → FAILED，reason DEVICE_UNAVAILABLE）。
# AS_DISPATCH_MAX_ATTEMPTS / AS_DISPATCH_RECEIPT_TIMEOUT / AS_DISPATCH_DEVICE_WAIT_MAX 覆盖。
dispatch:
  max_attempts: 2
  receipt_timeout: 30m
  device_wait_max: 2h
# 审批体系（P1-L5）：驳回导出 GET /rejections 的 [from, to] 最大跨度（超限 400）；AS_APPROVAL_REJECTION_EXPORT_MAX_SPAN 覆盖。
approval:
  rejection_export_max_span: 744h
# 保留期（P1-L7）：raw_object 按 kind 的保留天数（RawStore.Put 写 expire_at，worker retention 任务到期删对象）；
# 缺任何 kind 启动失败。table_days 只登记不删（audit_log / run_event 不由 retention 清理）。天数均为草拟值「待法务确认」。
retention:
  raw_object_days:
    LLM_IO: 180
    TOOL_RAW: 180
    SNAPSHOT: 1095
    CHECKPOINT: 30
    EXPORT: 30
    DEVICE_CMD: 1095
    RECEIPT_RAW: 1095
  table_days:
    audit_log: 1095
    run_event: 365
# 审计（P1-L7）：每日锚点 bucket（cmd/migrate up 建桶并开 object lock COMPLIANCE，天数「待法务确认」）与审计导出区间上限。
audit:
  anchor_bucket: agri-steward-audit-anchor
  anchor_lock_days: 365
  export_max_span: 744h
# 观测（P1-L7-B）：server / worker 各自的 /metrics 监听（不经业务鉴权，只监听这里配置的地址）；
# AS_METRICS_SERVER_ADDR / AS_METRICS_WORKER_ADDR / AS_METRICS_PATH 覆盖。
metrics:
  server_addr: 127.0.0.1:9101
  worker_addr: 127.0.0.1:9102
  path: /metrics
# 告警扫描（P1-L7-B）：无引用建议扫描回看窗口（阈值待实测）、审批积压 gauge 刷新周期、告警审计短写超时（≤500ms）；
# AS_ALERTS_NO_CITATION_WINDOW / AS_ALERTS_BACKLOG_REFRESH / AS_ALERTS_AUDIT_WRITE_TIMEOUT 覆盖。
alerts:
  no_citation_window: 2m
  backlog_refresh: 30s
  audit_write_timeout: 500ms
# 评测调度与作废门禁（P2-L7a）：trial 并发度 = floor(qpm × 0.7 / llm_calls_per_trial)，至少 1（桩模型缺省 = 1）；
# 实验结束 infra_error 占比 > void_infra_error_rate 或存在 grader_error 即 VOID。AS_EVAL_QPM 等覆盖。
eval:
  qpm: 5
  llm_calls_per_trial: 3
  void_infra_error_rate: 0.05
