# MCP 工具 Server 配置（config.LoadTools 经 Viper 加载，环境变量覆盖，如 AS_TOOLS_WEATHER_MODE=real）。
# mode: mock | real。mock 读 mock_dir/{server}.yaml；real 目前只有 HTTP 客户端骨架，调用一律返回
# UPSTREAM "real not configured"（D6：不调用外网）。对接清单见 docs/mock-real-status.md。
# real.api_key 是密钥，不得写在这里，只从 AS_TOOLS_{SERVER}_REAL_API_KEY 读取。
tools:
  mock_dir: configs/mock
  weather:
    mode: mock
    timeout: 3s
    level: read
    # P1 L6：正常读只认 fresh 内的缓存；TIMEOUT / UPSTREAM 时 now - collected_at ≤ max_staleness 的缓存回落
    # （source=cache），max_staleness 也是缓存写入 TTL。field / device 不缓存（配置即启动失败）。
    cache: {fresh: 10m, max_staleness: 1h}
    real: {base_url: ""}   # 待对接：气象源 D6
  crop:
    mode: mock
    timeout: 3s
    level: read
    cache: {fresh: 24h, max_staleness: 24h}
    real: {base_url: ""}   # 待对接：极飞 XGEO / 农技知识服务
  field:
    mode: mock
    timeout: 3s
    level: read
    real: {base_url: ""}   # 待对接：极飞 XGEO
  device:
    mode: mock
    timeout: 3s
    level: read
    # 待对接：极飞 XGEO。P1-L2：real 配了 base_url 即从设备平台 GET /v1/devices 取清单与实时状态，
    # 本地 / 预发指向 devicesim（如 AS_TOOLS_DEVICE_MODE=real AS_TOOLS_DEVICE_REAL_BASE_URL=http://127.0.0.1:8090）；
    # base_url 为空时 real 仍是骨架（UPSTREAM）。eval 与集成测试默认 mock。
    real: {base_url: ""}
