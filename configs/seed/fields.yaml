# 示范农场地块种子（cmd/migrate seed --file configs/seed/fields.yaml），按 uk_farm / uk_ext upsert，可重复执行。
# ext_field_code 与评测样本 context.field 一致；面积与播种日为占位，L2 起由 mcp-field 同步覆盖。
farm:
  tenant_id: 1
  farm_id: 1
  name: 示范农场1
  region: 江苏
  timezone: Asia/Shanghai
  main_crops: [水稻]
fields:
  - {ext_field_code: field-001, crop: 水稻, sowing_date: "2026-05-20", area_mu: 25.00}
  - {ext_field_code: field-002, crop: 水稻, sowing_date: "2026-05-20", area_mu: 28.00}
  - {ext_field_code: field-003, crop: 水稻, sowing_date: "2026-05-22", area_mu: 32.50}
  - {ext_field_code: field-004, crop: 水稻, sowing_date: "2026-05-22", area_mu: 40.00}
  - {ext_field_code: field-005, crop: 水稻, sowing_date: "2026-05-25", area_mu: 30.00}
  - {ext_field_code: field-006, crop: 水稻, sowing_date: "2026-05-25", area_mu: 35.00}
# P1-L0 feature_flag 种子（按 uk_flag_scope upsert）：示范农场 1 的 FARM 行 enable_advice 开；
# enable_robot_dispatch 不写，即默认关（只走 DRY_RUN）。value 为 JSON 字符串，形态按注册表校验。
flags:
  - {flag_key: enable_advice, tenant_id: 1, farm_id: 1, value: '{"on":true}', comment: 种子：示范农场开启建议}
