# weather mock 数据（weather.LoadMock 严格解析，未知字段报错）。
# 示范农场1 共用一个虚拟站点；daily 是 10 天循环序列，按日期（UTC 天序号 mod 10）投影到任意日期，结果确定。
# realtime 是实况；observation_lag 是实况/预报的数据滞后，决定 data_freshness_sec。
source: mock-station
observation_lag: 20m
fields: [field-001, field-002, field-003, field-004, field-005, field-006]
realtime: {temp_c: 29.5, humidity_pct: 78, wind_speed_ms: 2.6, rain_mm: 0}
