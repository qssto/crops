  outcome: ADVICE
  advice:
    category: protect
    advice_type: 作业类
    conclusion: 虫口达标，吡蚜酮按登记用量施用，亩用药量与总用量由规则层计算（草拟，待专家确认）
    must_cite: [kb:rice/pest/planthopper@v1, kb:common/operation_window/dosage-dilution@v1]
    target: planthopper
    product_in: [pymetrozine-50wg]
    numbers:
      - {field: dose_per_mu_min, value: 8, unit: g/亩, precision: 0.1}
      - {field: dose_per_mu_max, value: 12, unit: g/亩, precision: 0.1}
      - {field: water_per_mu, value: 30, unit: L/亩, precision: 1}
      - {field: product_total_min, value: 240, unit: g, precision: 1}
      - {field: product_total_max, value: 360, unit: g, precision: 1}
  trajectory:
    must_call: [field.profile, field.pest_survey]
    must_not_call: ["device.*"]
    budget: {max_steps: 14, max_tokens: 10000}
  compaction:
    constraints: [旁边是蜂场, 这块田不能用吡虫啉]
    compacted: true
