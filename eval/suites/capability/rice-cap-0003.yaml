id: rice-cap-0003
version: 1
suite: capability
difficulty: hard
crop: rice
stage: 分蘖期
tags: [L4, protect.dosage]
question: 1号田用吡蚜酮背负式喷雾打稻飞虱，每亩用多少药、兑多少水？整块田要备多少药？
context:
  farm: farm-demo-01
  field: field-001
  role: operator
  user: u-op-01
fixtures:
  clock: 2026-07-18T07:30:00+08:00
  mcp:
    crop.phenology:
      - match: {field: field-001}
        return: {stage: 分蘖期, sub_stage: 分蘖末期, expected_harvest: "2026-10-15"}
    field.profile:
      - match: {field: field-001}
        return: {area_mu: 30.0, no_fly_zones: [], adjacent_fields: []}
    field.pest_survey:
      - match: {field: field-001}
        return: {pest: 稻飞虱, density_per_100_hills: 1300, collected_at: "2026-07-17"}
    weather.forecast:
      - match: {field: field-001}
        return: {wind_speed_ms: 2.0, rain_mm_24h: 0, temp_c: 26, collected_at: "2026-07-18T06:30:00+08:00", source: mock-station}
    field.history:
      - match: {field: field-001}
        return: {operations: []}
  # P2 L6 长会话：二十轮之前的问答写进 trial 库（各轮由早到晚，最后一轮在提问前一分钟），本次提问带 prev_run_id 续接。
  # 自由文本估算约 1920 token（compaction.freeTokens 口径），稳超 trigger_tokens 1200，较早轮次进摘要；第一轮的蜂场与第三轮的禁用药须原样留在 facts.user_constraints。
  # 第五轮带两次虫口实测（上周那次已被取代，不得进 facts.measured）；第六轮的噻虫嗪建议被审批以药剂不对驳回：
  # 该药须进 vetoed_products（REJECTED_ORDER），其结论不得进 confirmed_conclusions。
  session:
    phenology_stage: 分蘖期
    turns:
      - question: 先说一下情况，1号田东边紧挨着一片林子，旁边是蜂场，每年这个时候蜜蜂出来采粉，打药之前一定要先考虑这个问题，你帮我记着，后面问打药的事都要算上这一条，免得到时候出麻烦。
      - question: 这几天早上去田里转了一圈，叶子下面能看到一些小飞虫，人一过去就往下掉，不知道是不是稻飞虱，也可能是叶蝉，你先告诉我怎么区分这两种虫，看哪些地方能分得清楚，我回头再去仔细看看。
        conclusion: 先查基部虫口与成若虫比例，区分稻飞虱与叶蝉后再定是否防治（草拟，待专家确认）
        cite: [rice/pest/planthopper@v1]
      - question: 去年邻居用了吡虫啉，效果很差，还说这一带的飞虱对它抗性很高，这块田不能用吡虫啉，以后推荐药剂的时候别再把它列进来了，换别的登记药剂，你帮我记住这一条，不管谁来问都一样。
      - question: 怎么查虫口比较准，是随便找几丛拍一拍就行，还是要按什么方法走，走多少个点，每个点看多少丛，你给我讲一下标准一点的做法，我让工人照着做，回来把数报给你，再让你算要不要打药。
        conclusion: 按平行跳跃法取点拍查，记录每百丛虫量后再判断是否达到防治指标（草拟，待专家确认）
        cite: [rice/pest/planthopper@v1]
      - question: 工人说今天早上查完了，平均下来每百丛差不多一千多头，比上周多了不少，主要是若虫，田里还比较潮，这个数到没到要打药的程度，要是到了的话，大概什么时候打比较合适一点。
        measured:
          - {tool: field.pest_survey, superseded: true, result: {pest: 稻飞虱, density_per_100_hills: 600, collected_at: "2026-07-10"}}
          - {tool: field.pest_survey, result: {pest: 稻飞虱, density_per_100_hills: 1300, collected_at: "2026-07-17"}}
      - question: 这几天的天气怎么样，会不会下雨，风大不大，我们这边打药一般用背负式喷雾器，工人怕风大飘到别处去，尤其是东边那一片，你帮我看看哪几天、什么时间段比较适合下地喷药，别白打了。
        conclusion: 风小无雨时段可用噻虫嗪背负式喷雾（草拟，待专家确认）
        product: 噻虫嗪
        cite: [rice/pest/planthopper@v1]
        order: {status: REJECTED, reject_code: PRODUCT, reject_text: 噻虫嗪对蜜蜂高毒，东边紧邻蜂场不能用}
      - question: 背负式喷雾器一桶大概能装多少水，每亩地要喷几桶才能喷匀，工人以前都是凭感觉兑药，有时候浓有时候淡，这次想按规范来，你先跟我讲一下兑水的大概原则，具体数字后面我再问你。
      - question: 打药的时候人要注意什么防护，口罩手套是不是都要戴，喷完之后多久才能下田干活，还有喷完的空药瓶和剩下的药水该怎么处理，以前都是随手扔在田埂上，今年村里说要管起来了。
      - question: 打完药之后多久能看出效果，要是三五天之后虫还是很多，是要补打一次还是换一种药，补打的时候用量要不要加，工人老说多加一点保险，我觉得不太对，你帮我把这个道理讲清楚。
      - question: 另外，田里的水层要不要先调一下，打药前是保持浅水还是排干，打完之后多久再灌水，我听说水层对飞虱有影响，也会影响药效，你把这几个时间点帮我理一理，免得工人搞混了。
      - question: 隔壁的2号田也是同一个品种，插秧时间差不多，要是1号田打药的话，2号田要不要一起打，还是先查一下虫口再说，我不想两块田都打，能省一点就省一点，你看怎么安排比较合理。
      - question: 还有一个事情，田边的沟里有些杂草长得很高，听说杂草也会藏飞虱，要不要顺便把沟边的草也处理掉，用割的还是用药除，用药的话会不会影响到田里的稻子，你一起帮我想想看。
      - question: 今年雨水比往年多，田里一直比较湿，除了飞虱以外，还要不要防一下纹枯病之类的病害，能不能和飞虱的药一起打，混在一起会不会有问题，工人想一次打完，省得跑两趟。
      - question: 前两年这块田收割之后稻桩留得比较高，冬天也没有翻耕，听人说稻桩里会藏越冬的虫子，开春之后虫子就从那里爬出来，今年秋收之后要不要把稻桩处理一下，是翻耕好还是放水泡田好，你给我讲讲这两种做法各有什么好处。
      - question: 田里有几处秧苗长得特别密，是当时插秧的时候没插匀，现在封行之后底下很闷，通风不好，飞虱好像就是从这几处先多起来的，要不要把密的地方稍微疏一疏，还是等晒田的时候一起处理，晒田大概安排在什么时候合适。
      - question: 我看别人家田里挂了一些黄色的板子，说是可以粘虫，我们这块田挂这种板子有没有用，对稻飞虱管不管用，一亩地要挂多少块，挂多高合适，多久换一次，要是效果一般的话我就先不花这个钱了，你帮我算算划不划算。
      - question: 今年的稻子品种是去年新换的，种子店说抗病性比以前那个好，但是没说抗不抗虫，我想知道品种对飞虱发生有没有影响，明年选种的时候要看哪些指标，能不能找到对飞虱耐受一点的品种，你先给我讲讲大概的思路就行。
      - question: 往年这个时候农技站会发一些病虫情报，说今年哪种虫偏重发生，我这几天还没看到今年的通知，你知不知道一般从哪里能看到这些情报，看的时候主要看哪几项内容，对我们这样的小田块有多大参考价值，你帮我说一说。
      - question: 工人记数的时候用的是纸本子，记得乱七八糟，有时候日期都没写，我想以后让他们按一个固定的表来记，每次查虫口、打药、施肥都记下来，你帮我想想这个表要包括哪几栏，记到什么程度才算够用，方便以后回头查。
      - question: 我再确认一下，上面说的这些，你都结合我们田边的情况来考虑了吧，包括哪些药不能用、东边要特别小心这些，等会儿我要问具体用量了，你给我的时候别漏掉这些前提条件。
knowledge_ref: WORKTREE
