    must_not_call: ["device.actuate", "device.dispatch"]
    budget: {max_steps: 40, max_tokens: 16000}
author: claude-draft
review_status: pending_expert
signed_at: 2026-10-30
notes: P1-L4-A 退回重审后再下发：首审通过 → 下发器④复检降雨 12mm 拦截并 Reopen（APPROVED → PENDING_APPROVAL(RECHECK_FAILED)，新票 ticket_seq=2）；脚本对新票重审通过 → 新 ticket_id 的 order.dispatch 排空，复检通过后 DRY_RUN 下发一次，作业单 DONE；budget 含两次下发器复检与选设备调用
