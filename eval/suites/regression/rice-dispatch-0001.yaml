      - match: {field: field-003}
        returns:
          - {wind_speed_ms: 2.5, rain_mm_24h: 0, temp_c: 30, collected_at: "2026-07-16T17:00:00+08:00", source: mock-station}
          - {wind_speed_ms: 2.5, rain_mm_24h: 12, temp_c: 27, collected_at: "2026-07-16T17:50:00+08:00", source: mock-station}
          - {wind_speed_ms: 2.0, rain_mm_24h: 0, temp_c: 28, collected_at: "2026-07-16T17:50:00+08:00", source: mock-station}
    crop.phenology:
      - match: {field: field-003}
        return: {stage: 分蘖期, sub_stage: 分蘖末期}
    field.pest_survey:
      - match: {field: field-003}
        return: {pest: 稻飞虱, density_per_100_hills: 2100, collected_at: "2026-07-16"}
    field.profile:
      - match: {field: field-003}
        return: {area_mu: 10, expected_harvest: "2026-10-20", no_fly_zones: [], adjacent_fields: []}
    field.history:
      - match: {field: field-003}
        return: {operations: []}
    device.list:
      - match: {field: field-003}
        return: {devices: [{device_id: uav-p100-01, kind: drone, model: 极飞 P100 Pro, capabilities: [spray, spread]}]}
    device.status:
      - match: {device_id: uav-p100-01}
        return: {device_id: uav-p100-01, online: true, state: idle, battery_pct: 100, tank_l: 30, last_seen_at: "2026-07-16T17:59:00+08:00"}
  approver: approve
  dispatch:
    reapprove: approve
knowledge_ref: WORKTREE
expect:
  outcome: ADVICE
  advice:
    category: protect
    advice_type: 作业类
    conclusion: 达到防治指标，生成植保作业单草稿并转审批（草拟，待专家确认）
    must_cite: [kb:rice/pest/planthopper@v1, kb:common/operation_window/spray@v1, kb:common/operation_window/uav@v1]
