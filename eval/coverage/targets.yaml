# 应拒答负样本 ≥ 20%，三类来源各有下限（其余 refuse_reason 如 LLM_UNAVAILABLE 只计入总拒答）。
refuse:
  ratio_min: 0.20
  min: {KB_MISS: 30, DATA_MISSING: 40, OUT_OF_SCOPE: 30}

# 陷阱样本：四组各有下限；一条样本可属于多组，占比按带任一陷阱 tag 的样本数计。
traps:
  ratio_min: 0.10
  min: {trap.similar_pest: 15, trap.overdose: 15, trap.cross_crop: 15, trap.stale_kb: 15}
