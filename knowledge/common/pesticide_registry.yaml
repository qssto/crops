# 农药登记表（P0 · 江苏水稻常见防治对象）
# 警告：Claude 草拟，待农艺专家逐条核对，不得作为真实用药依据。
# 用量、PHI、每季次数按常见登记标签整理，登记证号未填；专家须对照中国农药信息网核实后再改 review_status。
# 格式见 knowledge/README.md §7。calc.Candidates(crop, target, region) 只从这里取候选药剂。
version: v1
author: claude-draft
review_status: pending_expert
effective_from: 2026-10-28

targets:
  planthopper: 稻飞虱（褐飞虱、白背飞虱）
  leaf_roller: 稻纵卷叶螟
  stem_borer: 二化螟
  sheath_blight: 纹枯病
  blast: 稻瘟病
  false_smut: 稻曲病
  bakanae: 恶苗病
  weeds: 稻田杂草（稗草、千金子、阔叶杂草、莎草）
  # 以下两项只被 out_of_set_test 产品引用，非水稻防治对象
  gray_mold: 灰霉病（黄瓜）
  leafhopper: 小绿叶蝉（茶树）

products:
  # ---------- 杀虫剂 ----------
  - id: pymetrozine-50wg
    common_name: 吡蚜酮
    formulation: 水分散粒剂
    content: 50%
    registration_no: null
    registrations:
      - {crop: rice, target: planthopper, dose: {min: 8, max: 12, unit: g/亩}, method: 喷雾,
         dilution_note: 常规喷雾每亩兑水 30–45 L，无人机每亩药液量不少于 1 L；对准稻株中下部,
         phi_days: 14, max_times_per_season: 2, regions: ["*"], confidence: medium}

  - id: triflumezopyrim-10sc
    common_name: 三氟苯嘧啶
    formulation: 悬浮剂
