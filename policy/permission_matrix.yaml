# 权限矩阵 v1（P1 §6.2 功能任务 6）。由 service.LoadPermissionMatrix 加载，controller 路由与 service 细分判定共用。
# 约束（加载时校验，违反即启动失败）：
#   - 角色限 farmer / farm_manager / agronomist / operator / admin / auditor / platform_admin / kb_expert / legal；
#     操作限 service.Operations；同一角色内操作不得重复，角色键不得重复。
#   - flag.write 只能授给 platform_admin（kb_expert / legal 同为平台角色也不行）。
#   - 未声明的「角色 × 操作」一律拒绝；kb_expert / legal 预留，本阶段无权限。
# 审批还需同时满足 risk_matrix.yaml 的 required_role（用药类 SPRAY 只有 agronomist）；DecisionService 按作业类型取 decide.pesticide（SPRAY）或 decide.other 判定。
# rejection.export（P1-L5 驳回原因导出）授给 farm_manager / agronomist / auditor。
# audit.export（P1-L7 审计导出）只授给 auditor / platform_admin（L7 起 admin 不再持有）。
# advice.feedback（P2-L8 采纳 / 差评）授给持 advice.read 的在场业务角色（auditor / platform_admin 只读，不授，最小授权）；attribution.write（P2-L8 归因问题处置，平台路由）只授给 platform_admin。
# 取值为草拟，待 Owner 确认。
version: 1
roles:
  farmer: [ask, advice.read, advice.feedback]
  farm_manager: [ask, advice.read, approval.submit, approval.decide.other, order.cancel, raw.read, order.reconcile, rejection.export, advice.feedback]
  agronomist: [ask, advice.read, approval.submit, approval.decide.pesticide, approval.decide.other, order.cancel, raw.read, rejection.export, advice.feedback]
  operator: [ask, advice.read, order.cancel, advice.feedback]
  admin: [ask, advice.read, order.cancel, advice.feedback]
  auditor: [advice.read, audit.export, raw.read, rejection.export]
  platform_admin: [advice.read, order.cancel, audit.export, raw.read, flag.write, order.reconcile, attribution.write]
  kb_expert: []
  legal: []
